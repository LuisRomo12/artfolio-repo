name: Lint and Syntax Verification

on:
  pull_request:
    branches:
      - main

jobs:
  lint-backend:
    name: Backend Syntax Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8

      - name: Run Syntax Compile Check
        run: |
          python -m py_compile backend/app/main.py backend/app/config.py backend/app/database.py backend/app/models.py backend/app/routes/auth.py backend/app/routes/collections.py backend/app/routes/artworks.py backend/app/utils/security.py backend/scripts/db_migrate.py

      - name: Run Flake8 Linter
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
          # Treat all other issues as warnings for lint statistics
          flake8 backend/app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  lint-frontend:
    name: Frontend Syntax Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Run Build (Vite Syntax Validation)
        working-directory: ./frontend
        run: npm run build